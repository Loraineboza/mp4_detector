name: Detector metrics and synthetic experiment

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  numpy-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip numpy pytest
      - run: python -m compileall -q train.py img_eval.py mp4_eval.py detection_metrics.py
      - run: python -m pytest -q tests_metrics

  synthetic-pytorch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip numpy
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python synthetic_experiment/experiment.py --output-dir /tmp/synthetic-artifacts
      - name: Upload checkpoint and metrics
        uses: actions/upload-artifact@v4
        with:
          name: pytorch-synthetic-experiment
          path: /tmp/synthetic-artifacts/
          if-no-files-found: error
          retention-days: 30

  torchvision-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip numpy pillow tqdm
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -c "import torch, torchvision; from train import get_model; print(torchvision.models.detection.FasterRCNN_ResNet50_FPN_Weights.DEFAULT); model = get_model(21, pretrained=False); print('torch', torch.__version__); print('torchvision', torchvision.__version__); print(type(model).__name__)"
